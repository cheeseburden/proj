services:
  # 1. Apache Kafka in KRaft Mode (No external Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: fake-news-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-net

  # 2. Hadoop HDFS NameNode
  hdfs-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: fake-news-hdfs-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=fake-news-cluster
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:9000
    volumes:
      - hdfs_namenode_data:/hadoop/dfs/name
    networks:
      - pipeline-net

  # 3. Hadoop HDFS DataNode
  hdfs-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: fake-news-hdfs-datanode
    ports:
      - "9864:9864"
    environment:
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - CORE_CONF_fs_defaultFS=hdfs://hdfs-namenode:9000
    volumes:
      - hdfs_datanode_data:/hadoop/dfs/data
    depends_on:
      - hdfs-namenode
    networks:
      - pipeline-net

  # 4. FastAPI Backend & Dashboard UI
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-api
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HDFS_URL=http://hdfs-namenode:9870
      - HDFS_USER=root
      - HDFS_BASE_DIR=/data/news
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data/models:/app/data/models
      - ./data/raw:/app/data/raw
    depends_on:
      - kafka
      - hdfs-namenode
      - hdfs-datanode
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - pipeline-net

  # 5. Kafka Stream Consumer & HDFS Writer Worker
  consumer-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-consumer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HDFS_URL=http://hdfs-namenode:9870
      - HDFS_USER=root
      - HDFS_BASE_DIR=/data/news
    depends_on:
      - kafka
      - hdfs-namenode
      - hdfs-datanode
      - api
    command: ["python", "-u", "src/streaming/kafka_hdfs_consumer.py"]
    networks:
      - pipeline-net

  # 6. News Stream Simulator (Emits continuous news articles into Kafka)
  producer-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fake-news-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka
      - api
    command: ["python", "-u", "src/streaming/kafka_producer.py"]
    networks:
      - pipeline-net

volumes:
  hdfs_namenode_data:
  hdfs_datanode_data:

networks:
  pipeline-net:
    driver: bridge
